<svg viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg">
  <!-- HI Logo - Single continuous path for motion path animation -->
  <!-- Path traces the outline of H then jumps to I -->

  <!-- H outline as continuous path -->
  <path id="h-path" d="
    M 0,0
    L 45,0
    L 45,125
    L 95,125
    L 95,0
    L 140,0
    L 140,300
    L 95,300
    L 95,175
    L 45,175
    L 45,300
    L 0,300
    Z
  " fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- I outline as continuous path -->
  <path id="i-path" d="
    M 180,0
    L 280,0
    L 280,300
    L 180,300
    Z
  " fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Combined single continuous path for motion animation -->
  <!-- Traces H clockwise, then I clockwise -->
  <path id="hi-motion-path" d="
    M 0,0
    L 45,0
    L 45,125
    L 95,125
    L 95,0
    L 140,0
    L 140,300
    L 95,300
    L 95,175
    L 45,175
    L 45,300
    L 0,300
    L 0,0
    M 180,0
    L 280,0
    L 280,300
    L 180,300
    L 180,0
  " fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

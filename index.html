<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iterate Hawaii | AI Solutions for Hawaii</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      ITERATE-HI
    </div>
    <button class="nav-cta">CONTACT</button>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero">
    <!-- Background shape that morphs -->
    <div class="hero-shape">
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
        <!-- Sharp, jagged shape (starting state) -->
        <path id="morphShape" d="M 200,40 L 240,80 L 220,85 L 280,120 L 250,130 L 320,160 L 290,175 L 350,220 L 310,230 L 360,280 L 320,285 L 340,340 L 300,330 L 280,370 L 250,350 L 200,380 L 150,350 L 120,370 L 100,330 L 60,340 L 80,285 L 40,280 L 90,230 L 50,220 L 110,175 L 80,160 L 150,130 L 120,120 L 180,85 L 160,80 Z"/>
        <!-- Smooth, pleasant shape (end state - hidden but accessible for morphTo) -->
        <path id="smoothShape" d="M 200,50 Q 260,80 300,130 Q 340,180 350,240 Q 355,300 320,340 Q 280,375 220,380 Q 160,375 120,340 Q 85,300 90,240 Q 100,180 140,130 Q 180,80 200,50 Z" visibility="hidden"/>
      </svg>
    </div>

    <div class="hero-content">
      <h1>Simple AI. Powerful Results.</h1>
      <p class="hero-sub">We personalize AI to your company's real needs—automating tasks, building smarter experiences, and streamlining operations.</p>
      <div class="hero-ctas">
        <button class="btn-primary">Get Started</button>
        <button class="btn-secondary">See How It Works</button>
      </div>
    </div>
  </section>

  <!-- Spacer section so we can scroll -->
  <section class="spacer"></section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
